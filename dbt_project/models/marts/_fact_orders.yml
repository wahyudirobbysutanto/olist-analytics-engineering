version: 2
models:
  - name: fact_orders
    description: "Fact table containing order line items with associated seller, customer, and product attributes as of the order purchase timestamp."
    columns:
      - name: order_id
        description: "Business identifier for the order."
        tests:
          - not_null
      - name: order_item_id
        description: "Business identifier for the order line item."
        tests:
          - not_null
      - name: seller_id
        description: "Surrogate key of the seller from dim_sellers."
        tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: seller_city
        description: "City where the seller is located (effective at order time)."
      - name: seller_state
        description: "State where the seller is located (effective at order time)."
      - name: customer_id
        description: "Business identifier of the customer who placed the order."
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: customer_city
        description: "City of the customer at the time of the order."
      - name: customer_state
        description: "State of the customer at the time of the order."
      - name: product_id
        description: "Business identifier of the product ordered."
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: product_sk
        description: "Surrogate key of the product from dim_products."
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_sk
      - name: product_category_name
        description: "Category name of the product."
      - name: order_status
        description: "Current status of the order (e.g., delivered, cancelled)."
      - name: order_purchase_timestamp
        description: "Timestamp when the order was placed."
        tests:
          - not_null
      - name: price
        description: "Unit price of the product for this order line."
      - name: freight_value
        description: "Freight cost associated with this order line."
      - name: total_amount
        description: "Total amount for the line item (price + freight)."