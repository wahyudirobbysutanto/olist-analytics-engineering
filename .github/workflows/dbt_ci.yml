name: dbt CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres

      - name: Setup dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          olist_analytics:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: postgres
                password: postgres
                dbname: postgres
                schema: analytics
                threads: 4
          EOF

      - name: Install dbt packages
        run: |
          cd dbt_project
          dbt deps

      - name: Run dbt parse (Validate Syntax)
        run: |
          cd dbt_project
          dbt parse